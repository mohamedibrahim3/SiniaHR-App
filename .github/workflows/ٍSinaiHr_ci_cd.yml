name: Android CI - Sinai HR App

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Pull Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2) Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Enable Gradle Cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # 4) Make gradle executable
      - name: Permissions for gradlew
        run: chmod +x ./gradlew

      # 5) Clean
      - name: Clean Project
        run: ./gradlew clean

      # 6) Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 7) Lint
      - name: Run Lint
        run: ./gradlew lintDebug

      # 8) Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 9) Upload APK artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
